# Task 3 POST-HOC experiments (docs/ideas.md). Layered on task3.yaml, which is NOT changed:
# the pre-registered default (D1 = M1) and every U6-U8 setting stay exactly as committed.
#
# These methods were designed AFTER seeing the U6-U8 results and are reported as post-hoc
# ablations only. Their settings below were fixed (2026-10-21) BEFORE any of them was run;
# they are not tuned on target scores.
base_config: task3.yaml

posthoc:
  methods:
    M7: M1 + balanced bias. Sinkhorn on unlabelled target dev embeddings vs M1 prototypes with
        uniform class marginals; the class potentials become per-class score offsets applied to
        target val (argmax of cosine / temperature + offset).
    M8: M1 + balanced prototype re-estimation. Prototypes = transport-weighted means of the
        unlabelled target dev embeddings (Sinkhorn plan, uniform marginals) plus the pinned
        support windows; then nearest centroid.
    M9: M5 + balanced bias. Logistic-regression log-probabilities on unlabelled target dev,
        Sinkhorn with uniform class marginals; potentials as per-class offsets on target val.
  balance:
    temperature: 0.1     # cosine similarities are divided by this (M7, M8); M9 uses log-probs as is
    iters: 100           # Sinkhorn iterations (log domain)
    marginal: uniform    # assumed target class proportions (a prior, not a label)

  # ---- batch 2 (fixed 2026-10-21, after the M7-M9 results, BEFORE running any of these) ----
  selftrain:             # M10: M9 + balanced self-training on unlabelled target dev windows
    rounds: 2            # each round: balanced assignment (Sinkhorn on log-probs) of target dev
                         #   non-support windows -> pseudo-labels -> refit the logistic regression
                         #   on source shared + support + pseudo-labelled windows
    keep_frac: 0.5       # per class, keep the most confident half of its pseudo-labelled windows
  slices: [25, 50]       # idea 7: default-encoder embeddings of contiguous 25- / 50-row slices,
                         #   averaged per 150-row window (sources slice25, slice50)
  mae:                   # idea 6: a label-free MAE encoder as an extra feature source
    run: t3_mae_s0       # outputs/task2/<run>, trained with: scripts/task2_pretrain.py
    seed: 0              #   --run t3_mae_s0 --seed 0 --method mae (Task 2 defaults otherwise)
  batch2_sources: [handcrafted, random_init_s0, default+random_init_s0, slice25, slice50, mae_s0]
  batch2_methods: [M1, M9, M10]   # each run on every batch-2 source (M10 on default too)

  # ---- batch 2b robustness check (fixed after seeing mae_s0, before training these) ----
  mae_seeds: [0, 1, 2]   # MAE encoders t3_mae_s<seed>, same command and defaults as seed 0;
                         #   sources mae_s1, mae_s2 with M1 / M9 / M10, reported as mean over seeds

  # ---- batch 3 (fixed 2026-10-21 after batch 2, BEFORE training / running any of these) ----
  simclr_seeds: [1, 2]   # SimCLR encoders t3_simclr_s<seed> (scripts/task2_pretrain.py --run
                         #   t3_simclr_s<seed> --seed <seed>, Task 2 defaults, label-free selection);
                         #   sources simclr_s1, simclr_s2. Seed 0 = the committed default encoder.
  ensembles:             # every member is weighted equally; no member is chosen by a score
    ens_mae: [mae_s0, mae_s1, mae_s2]
    ens_simclr: [default, simclr_s1, simclr_s2]
    ens_all: [default, simclr_s1, simclr_s2, mae_s0, mae_s1, mae_s2]
  # M11: probability ensemble. For each member: M1 features of that member, class-balanced
  #   logistic regression (as M5/M9) on source shared + support. Average the members' predicted
  #   probabilities; Sinkhorn (uniform class marginals, posthoc.balance) on the log of the mean
  #   probabilities of unlabelled target dev windows; the class offsets are applied to target val.
  # Concatenation ensembles: M9 on sources mae_s0+mae_s1+mae_s2 and default+simclr_s1+simclr_s2.
  batch3_runs:
    - {methods: [M1, M9], sources: [simclr_s1, simclr_s2]}
    - {methods: [M11], sources: [ens_mae, ens_simclr, ens_all]}
    - {methods: [M9], sources: [mae_s0+mae_s1+mae_s2, default+simclr_s1+simclr_s2]}
