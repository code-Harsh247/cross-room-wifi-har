[project]
name = "xroom"
version = "0.1.0"
description = "Cross-room few-shot adaptation for WiFi activity recognition (CS60055 Hackathon 2)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyyaml", "scikit-learn", "matplotlib", "joblib", "torch", "umap-learn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
